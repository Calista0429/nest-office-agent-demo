<text x="696" y="295" fill="#34d399" font-size="13" font-weight="600">Transactional booking store</text>
<text x="696" y="315" fill="#cbd5e1" font-size="10">Atomic group writes + rollback</text>
<text x="696" y="332" fill="#cbd5e1" font-size="10">Idempotent operation fingerprints</text>
<text x="696" y="349" fill="#cbd5e1" font-size="10">Reschedule preserves original on fail</text>
