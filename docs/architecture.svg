<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="diagram-title diagram-desc" style="font-family:'JetBrains Mono',monospace">
<title id="diagram-title">NEST — Office booking architecture</title><desc id="diagram-desc">A React browser sends requests to a Node API. A rule-based Japanese and English parser and seat recommendation engine find options. Transactional storage saves confirmed bookings in SQLite. A separate optional build targets a Worker with D1; it is not deployed. No LLM is connected.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="790" fill="#020617"/><rect width="1000" height="790" fill="url(#grid)"/>
<rect x="20" y="20" width="960" height="510" rx="12" fill="none" stroke="#475569" stroke-dasharray="8 4"/>
<text x="43" y="52" fill="#e2e8f0" font-size="13" font-weight="600">01 / LOCAL DEMO — IMPLEMENTED</text><text x="43" y="73" fill="#94a3b8" font-size="10">Node.js 24+ · 127.0.0.1:4173 · Japan time (Asia/Tokyo)</text>
<!-- Connections are behind all component boxes. -->
